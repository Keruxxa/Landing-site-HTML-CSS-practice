<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Landing</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="container">
      <header class="header">
        <div class="header__logo-side">
          <a class="header__logo" href="">
            <img src="assets/logo.svg" alt="logo" width="24" height="24" />
          </a>
          <span class="header__company-name">NORDIC</span>
        </div>
        <div class="header__nav-side">
          <nav>
            <ul class="header__nav">
              <li>
                <a class="header__link header__link--active" href="">Главная</a>
              </li>
              <li>
                <a class="header__link" href="">О нас</a>
              </li>
              <li>
                <a class="header__link" href="">Услуги</a>
              </li>
              <li>
                <a class="header__link" href="">Портфолио</a>
              </li>
              <li>
                <a class="header__link" href="">Блог</a>
              </li>
              <li>
                <a class="header__link" href="">Контакты</a>
              </li>
            </ul>
          </nav>
        </div>
        <div class="header__contact-side">
          <img
            class="header__search"
            src="/assets/search.svg"
            alt="search"
            width="16"
            height="16"
          />
          <button class="btn-secondary">Связаться с нами</button>
        </div>
      </header>
    </div>

    <main></main>

    <div class="container">
      <footer></footer>
    </div>
  </body>
</html>
